<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miner Board Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1 id="brandH1"></h1><span id="brandSub"></span></div>
    <div class="seg" role="group" aria-label="Board" id="boards"></div>
    <div class="seg" role="group" aria-label="Mode">
      <button id="mFree" aria-pressed="true">Free mode</button>
      <button id="mTour" aria-pressed="false">Guided mode</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button id="vBoard" aria-pressed="true">3D board</button>
      <button id="vDiag" aria-pressed="false">Block diagram</button>
    </div>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="left" aria-label="Controls and component list">
    <section>
      <p class="label">Camera</p>
      <div class="views" id="views">
        <button data-view="iso" aria-pressed="true">Isometric</button>
        <button data-view="top">Top side</button>
        <button data-view="bottom">Bottom side</button>
        <button data-view="edge">Edge on</button>
      </div>
    </section>
    <section>
      <p class="label">Display</p>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="oCool"> Heatsink + fan</label>
        <label class="opt" id="oOledRow"><input type="checkbox" id="oOled" checked> OLED display module</label>
        <label class="opt"><input type="checkbox" id="oExplode"> Exploded view</label>
        <label class="opt"><input type="checkbox" id="oXray"> X-ray PCB (see through)</label>
        <label class="opt"><input type="checkbox" id="oPassive" checked> Passives (R / C)</label>
        <label class="opt"><input type="checkbox" id="oTP"> Test points</label>
        <label class="opt"><input type="checkbox" id="oLabels" checked> Labels</label>
        <label class="opt"><input type="checkbox" id="oColor"> Colour by subsystem</label>
      </div>
    </section>
    <section>
      <p class="label">Signal & power flows</p>
      <div class="opts" id="flowOpts"></div>
    </section>
    <section>
      <p class="label">Components</p>
      <input class="search" id="search" type="search" placeholder="Search ref, part or function" aria-label="Search components">
      <div id="list"></div>
    </section>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div id="tip" hidden></div>
    <div class="legend" id="legend" hidden></div>
    <div class="hint" id="hint">Drag to orbit · scroll to zoom · right-drag to pan · click a part</div>
    <div id="loading">BUILDING BOARD…</div>
    <div class="tour" id="tour" hidden>
      <div class="step" id="tStep"></div>
      <h2 id="tTitle"></h2>
      <div id="tBody"></div>
      <div class="row">
        <div class="dots" id="tDots"></div>
        <button class="btn" id="tPrev">Back</button>
        <button class="btn primary" id="tNext">Next</button>
      </div>
    </div>
    <div id="diagram" hidden></div>
  </main>

  <aside class="right" aria-label="Component inspector"><div class="insp" id="insp"></div></aside>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/boards/gamma.js"></script>
<script src="js/boards/supra.js"></script>
<script src="js/boards/ultra.js"></script>
<script src="js/boards/max.js"></script>
<script src="js/boards/gt.js"></script>
<script src="js/boards/hex.js"></script>
<script src="js/boards/nerdqaxep.js"></script>
<script src="js/boards/nerdqaxepp.js"></script>
<script src="js/app.js"></script>
</body>
</html>
