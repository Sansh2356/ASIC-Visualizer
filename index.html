<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASIC Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<!-- Apply theme before first paint to avoid flash -->
<script>
(function(){
  var stored = localStorage.getItem('asicv-theme');
  var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="header-row header-top">
      <div class="brand"><h1 id="brandH1"></h1><span id="brandSub"></span></div>
      <div class="spacer"></div>
      <div class="stats" id="stats"></div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
        <!-- sun: shown in dark mode to switch to light -->
        <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2m-3.5-7.5-1.4 1.4m-9.2 9.2-1.4 1.4m0-12.2 1.4 1.4m9.2 9.2 1.4 1.4"/>
        </svg>
        <!-- moon: shown in light mode to switch to dark -->
        <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
    <div class="header-row header-bottom">
      <div class="seg" role="group" aria-label="Board" id="boards"></div>
      <div class="spacer"></div>
      <div class="header-controls">
        <div class="seg" role="group" aria-label="Mode">
          <button id="mFree" aria-pressed="true">Free</button>
          <button id="mTour" aria-pressed="false">Guided</button>
        </div>
        <div class="seg" role="group" aria-label="View">
          <button id="vBoard" aria-pressed="true">3D board</button>
          <button id="vDiag" aria-pressed="false">Block diagram</button>
          <button id="vComp" aria-pressed="false">Compare</button>
        </div>
      </div>
    </div>
  </header>

  <aside class="left" aria-label="Controls and component list">
    <section>
      <details>
        <summary class="label">Camera</summary>
        <div class="views" id="views">
          <button data-view="iso" aria-pressed="true">Isometric</button>
          <button data-view="top">Top side</button>
          <button data-view="bottom">Bottom side</button>
          <button data-view="edge">Edge on</button>
        </div>
      </details>
    </section>
    <section>
      <details>
        <summary class="label">Display</summary>
        <div class="opts">
          <label class="opt"><input type="checkbox" id="oLabels" checked> Labels</label>
          <label class="opt"><input type="checkbox" id="oPassive" checked> Passives (R / C)</label>
          <label class="opt" id="oOledRow"><input type="checkbox" id="oOled" checked> OLED display</label>
          <label class="opt"><input type="checkbox" id="oCool"> Heatsink + fan</label>
          <div class="opts-divider" aria-hidden="true"></div>
          <label class="opt muted"><input type="checkbox" id="oExplode"> Exploded view</label>
          <label class="opt muted"><input type="checkbox" id="oXray"> X-ray PCB</label>
          <label class="opt muted"><input type="checkbox" id="oTP"> Test points</label>
          <label class="opt muted"><input type="checkbox" id="oColor"> Colour by subsystem</label>
        </div>
      </details>
    </section>
    <section>
      <details open>
        <summary class="label">Signal &amp; power flows</summary>
        <div class="opts" id="flowOpts"></div>
      </details>
    </section>
    <section class="section-components">
      <p class="label">Components</p>
      <input class="search" id="search" type="search" placeholder="Search ref, part or function" aria-label="Search components">
      <div id="list"></div>
    </section>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div id="tip" hidden></div>
    <div class="legend" id="legend" hidden></div>
    <div class="hint" id="hint">Drag to orbit · scroll to zoom · right-drag to pan · click a part</div>
    <div id="loading">BUILDING BOARD…</div>
    <div class="tour" id="tour" hidden>
      <div class="step" id="tStep"></div>
      <h2 id="tTitle"></h2>
      <div id="tBody"></div>
      <div class="row">
        <div class="dots" id="tDots"></div>
        <button class="btn" id="tPrev">Back</button>
        <button class="btn primary" id="tNext">Next</button>
      </div>
    </div>
    <div id="diagram" hidden></div>
    <div id="compare" hidden></div>
  </main>

  <aside class="right" aria-label="Component inspector"><div class="insp" id="insp"></div></aside>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/boards/gamma.js"></script>
<script src="js/boards/supra.js"></script>
<script src="js/boards/ultra.js"></script>
<script src="js/boards/max.js"></script>
<script src="js/boards/gt.js"></script>
<script src="js/boards/hex.js"></script>
<script src="js/boards/nerdqaxep.js"></script>
<script src="js/boards/nerdqaxepp.js"></script>
<script src="js/app.js"></script>
</body>
</html>
